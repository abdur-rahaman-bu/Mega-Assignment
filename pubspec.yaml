name: shop_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Networking & API ---
  dio: ^5.7.0                      # HTTP client with interceptors
  shared_preferences: ^2.3.3       # Local token storage

  # --- State Management ---
  provider: ^6.1.2

  # --- Images ---
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2

  # --- Utilities ---
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
